name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest is moving to Ubuntu 26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK. Accepting licenses lets Gradle fetch the platform it needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The built-in engine (llama-server, 1.5.182): rebuilt only when its recipe changes.
      - name: Cache the engine build
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: engine/out
          key: engine-${{ hashFiles('engine/build-llama.sh', 'engine/SOURCES.json') }}

      - name: Build the engine with the NDK
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq ninja-build > /dev/null || true
          bash engine/build-llama.sh

      # Gradle's downloads (the Robolectric jar alone is about 300 MB): reused between builds so Maven is asked less often.
      - name: Cache Gradle downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make the wrapper runnable
        run: chmod +x gradlew

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: PocketIDE-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
