name: Change record

# #BuildHybridAI: every change to the app, tests, benchmark, build or workflows is recorded in HYBRID-CHANGELOG.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check HYBRID-CHANGELOG.md was updated
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-changelog.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            scripts/check-changelog.sh "${{ github.event.before }}" "${{ github.sha }}"
          fi
      - name: Check the app map is up to date (scripts/gen_app_map.py)
        run: python3 scripts/gen_app_map.py --check
