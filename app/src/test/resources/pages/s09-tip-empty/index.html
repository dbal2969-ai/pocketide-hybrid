<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .calculator {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #4cae4c;
        }
        .result {
            margin-top: 20px;
            padding: 15px; 
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #e9f7ef;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Tip Calculator</h1>
        <div class="input-group">
            <label for="billInput">Bill Amount ($):</label>
            <input type="number" id="billInput" placeholder="Enter bill amount">
        </div>
        <div class="input-group">
            <label for="tipPercentInput">Tip Percentage (%):</label>
            <input type="number" id="tipPercentInput" min="0" max="100" placeholder="Enter tip percentage (e.g., 15 for 15%)">
        </div>
        <button id="calculateBtn">Calculate</button>
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
