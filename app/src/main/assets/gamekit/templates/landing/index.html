<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Site</title><meta name="description" content=""><link rel="stylesheet" href="appkit/ui.css">
<style>
body{background:var(--card)}nav.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 18px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.top .brand{font-weight:800;font-size:1.1rem;flex:1}nav.top a{color:var(--text);text-decoration:none;font-weight:600}nav.top .links{display:flex;gap:16px}#menu{display:none}
@media (max-width:700px){nav.top .links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--card);padding:12px 18px;border-bottom:1px solid var(--line)}nav.top .links.open{display:flex}#menu{display:inline-flex}}
section{padding:56px 18px}section>.in{max-width:1040px;margin:0 auto}section.alt{background:var(--bg)}
.hero{padding:80px 18px 64px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card))}.hero h1{font-size:clamp(2rem,6vw,3.2rem);margin-bottom:.3em}.hero p{font-size:1.15rem;color:var(--muted);max-width:640px;margin:0 auto 24px}
.feature .icon{font-size:1.8rem}.price{text-align:center}.price .amount{font-size:2rem;font-weight:800}.price.best{border:2px solid var(--accent)}.price ul{list-style:none;padding:0;text-align:left}.price li{padding:4px 0}.price li::before{content:"✓ ";color:var(--ok)}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{font-weight:600;cursor:pointer}footer{padding:28px 18px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}
.steps{counter-reset:s}.step::before{counter-increment:s;content:counter(s);display:inline-flex;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
</style></head>
<body><div id="site"></div><script type="module" src="app.js"></script></body></html>
