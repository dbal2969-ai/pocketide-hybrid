<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tic-tac-toe</title>
<link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Tic-tac-toe</h1>
  <p id="status"></p>
  <div id="grid">
    <button class="cell" data-i="0"></button>
    <button class="cell" data-i="1"></button>
    <button class="cell" data-i="2"></button><br>
    <button class="cell" data-i="3"></button>
    <button class="cell" data-i="4"></button>
    <button class="cell" data-i="5"></button><br>
    <button class="cell" data-i="6"></button>
    <button class="cell" data-i="7"></button>
    <button class="cell" data-i="8"></button><br>
  </div>
  <button id="new">New game</button>
<script src="game.js"></script>
</body>
</html>
