<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>To-do</title>
<style>body{font-family:sans-serif;margin:8px}li.done span{text-decoration:line-through;color:#888}input{font-size:18px;width:70%}button{font-size:18px}</style></head>
<body>
<h1>To-do</h1>
<input id="t" placeholder="New item"><button id="add">Add</button>
<ul id="l"></ul>
<script>
let items = JSON.parse(localStorage.getItem('todos') || '[]');
const l = document.getElementById('l'), t = document.getElementById('t');
function save() { localStorage.setItem('todos', JSON.stringify(items)); }
function render() {
  l.innerHTML = '';
  items.forEach((it, i) => {
    const li = document.createElement('li'); if (it.done) li.className = 'done';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = it.done; cb.onchange = () => { it.done = cb.checked; save(); render(); };
    const s = document.createElement('span'); s.textContent = ' ' + it.text + ' ';
    const del = document.createElement('button'); del.textContent = '✕'; del.setAttribute('aria-label', 'Delete'); del.onclick = () => { items.splice(i, 1); save(); render(); };
    li.append(cb, s, del); l.appendChild(li);
  });
}
function add() { const v = t.value.trim(); if (!v) return; items.push({ text: v, done: false }); t.value = ''; save(); render(); }
document.getElementById('add').onclick = add;
t.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
render();
</script></body></html>
