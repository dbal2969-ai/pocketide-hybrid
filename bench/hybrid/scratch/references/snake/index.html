<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snake</title>
<style>body{font-family:sans-serif;margin:8px;background:#111;color:#eee;text-align:center}canvas{background:#000;max-width:100%}button{font-size:20px;margin:4px;padding:8px 14px}</style></head>
<body>
<p><span id="score">Score: 0</span> · <span id="status">Press Start</span></p>
<canvas id="c" width="300" height="300"></canvas>
<div><button id="start">Start</button></div>
<div><button data-d="up">▲</button><br><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div>
<script>
const N = 15, S = 20, c = document.getElementById('c'), g = c.getContext('2d');
let snake, dir, next, food, score, timer = null, over = false;
const D = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }, OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
function reset() { snake = [{ x: 5, y: 7 }, { x: 4, y: 7 }]; dir = next = 'right'; score = 0; over = false; place(); draw(); }
function place() { do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; } while (snake.some(p => p.x === food.x && p.y === food.y)); }
function turn(d) { if (d && d !== OPP[dir]) next = d; }
function step() {
  dir = next; const h = { x: snake[0].x + D[dir][0], y: snake[0].y + D[dir][1] };
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(p => p.x === h.x && p.y === h.y)) { over = true; clearInterval(timer); timer = null; document.getElementById('status').textContent = 'Game over'; document.getElementById('start').textContent = 'Play again'; return; }
  snake.unshift(h); if (h.x === food.x && h.y === food.y) { score++; place(); } else snake.pop(); draw();
}
function draw() { g.fillStyle = '#000'; g.fillRect(0, 0, 300, 300); g.fillStyle = '#e33'; g.fillRect(food.x * S, food.y * S, S, S); g.fillStyle = '#3c3'; snake.forEach(p => g.fillRect(p.x * S, p.y * S, S - 1, S - 1)); document.getElementById('score').textContent = 'Score: ' + score; }
function start() { if (over || !timer) reset(); clearInterval(timer); timer = setInterval(step, 150); document.getElementById('status').textContent = 'Playing'; }
document.addEventListener('keydown', e => { const k = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key]; if (k) { turn(k); e.preventDefault(); } if (e.key === ' ') start(); });
let sx, sy; c.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
c.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); });
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => turn(b.dataset.d));
document.getElementById('start').onclick = start;
reset();
</script></body></html>
