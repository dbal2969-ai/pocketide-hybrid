<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calculator</title>
<style>body{font-family:sans-serif;margin:8px}#d{font-size:32px;text-align:right;padding:8px;border:1px solid #888;min-height:40px}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}button{font-size:24px;padding:14px}</style></head>
<body>
<div id="d">0</div>
<div class="k">
<button>7</button><button>8</button><button>9</button><button>÷</button>
<button>4</button><button>5</button><button>6</button><button>×</button>
<button>1</button><button>2</button><button>3</button><button>−</button>
<button>C</button><button>0</button><button>=</button><button>+</button>
</div>
<script>
const d = document.getElementById('d'); let cur = '', prev = null, op = null;
function show(v) { d.textContent = v; }
function calc(a, b, o) { return o === '+' ? a + b : o === '−' ? a - b : o === '×' ? a * b : b === 0 ? NaN : a / b; }
document.querySelectorAll('button').forEach(b => b.onclick = () => {
  const k = b.textContent;
  if (/\d/.test(k)) { cur += k; show(cur); }
  else if (k === 'C') { cur = ''; prev = null; op = null; show('0'); }
  else if (k === '=') { if (op && cur !== '') { const r = calc(prev, Number(cur), op); show(String(+r.toFixed(10))); cur = ''; prev = null; op = null; } }
  else { if (cur !== '') { prev = prev === null ? Number(cur) : calc(prev, Number(cur), op); } op = k; cur = ''; show(String(prev) + ' ' + k); }
});
</script></body></html>
